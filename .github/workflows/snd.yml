name: PyTorch Branch Build

on:
  push:
    branches:
      - "simpleclouddetect-pytorch"
    paths-ignore:
      - '*.md'
      - 'images/**'

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: simpleclouddetect-pytorch
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/simpleclouddetect:pytorch
            ${{ vars.DOCKERHUB_USERNAME }}/simpleclouddetect:pytorch-${{ steps.vars.outputs.sha_short }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64,linux/arm64
      
      # Prevent cache from growing indefinitely on self-hosted runner
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      
      - name: Get image size
        run: |
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/simpleclouddetect:pytorch
          IMAGE_SIZE=$(docker images --format "{{.Size}}" ${{ vars.DOCKERHUB_USERNAME }}/simpleclouddetect:pytorch | head -n1)
          echo "Docker image size: $IMAGE_SIZE"

      # Retain only the 2 newest pytorch-<sha> tags (current + one previous).
      # The rolling 'pytorch' tag is never touched.
      - name: Prune old pytorch-<sha> tags on Docker Hub
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
          REPO: simpleclouddetect
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP: 2
        run: |
          set -euo pipefail

          JWT=$(curl -sf -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${NAMESPACE}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ -z "${JWT}" ] || [ "${JWT}" = "null" ]; then
            echo "Failed to authenticate to Docker Hub" >&2
            exit 1
          fi

          # All pytorch-<sha> tags, newest first, dropping the KEEP most recent.
          OLD_TAGS=$(curl -sf -H "Authorization: JWT ${JWT}" \
            "https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPO}/tags/?page_size=100" \
            | jq -r --argjson keep "${KEEP}" \
                '.results
                 | map(select(.name | startswith("pytorch-")))
                 | sort_by(.last_updated) | reverse
                 | .[$keep:]
                 | .[].name')

          if [ -z "${OLD_TAGS}" ]; then
            echo "No old pytorch-<sha> tags to prune."
            exit 0
          fi

          for TAG in ${OLD_TAGS}; do
            echo "Deleting old tag: ${TAG}"
            curl -sf -X DELETE -H "Authorization: JWT ${JWT}" \
              "https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPO}/tags/${TAG}/"
          done
